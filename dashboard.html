<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Dashboard | Little Monks Safaris</title>
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="Access your Little Monks Safaris customer dashboard. Manage bookings, track trips, and view reservation details.">
    <meta name="robots" content="noindex, follow">
    <meta name="author" content="Little Monks Safaris">
    <link rel="icon" href="images/logo.png" type="image/png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="dashboard.css">

    <!-- Meta Pixel Code -->
    <script>
        !function(f,b,e,v,n,t,s)
        {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
        n.callMethod.apply(n,arguments):n.queue.push(arguments)};
        if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
        n.queue=[];t=b.createElement(e);t.async=!0;
        t.src=v;s=b.getElementsByTagName(e)[0];
        s.parentNode.insertBefore(t,s)}(window, document,'script',
        'https://connect.facebook.net/en_US/fbevents.js');
        fbq('init', 'YOUR_PIXEL_ID');
        fbq('track', 'PageView');
    </script>
    <noscript><img height="1" width="1" style="display:none" src="https://www.facebook.com/tr?id=YOUR_PIXEL_ID&ev=PageView&noscript=1" /></noscript>
    <!-- End Meta Pixel Code -->
</head>

<body>

    <main class="dashboard">
        <header class="dashboard-header">
            <a class="brand" href="index.html" aria-label="Little Monks Safaris home">
                Little Monks <span>Safaris</span>
            </a>
            <div class="header-actions">
                <a class="home-link" href="index.html">Home</a>
                <button id="logoutBtn" class="logout-button" type="button">Log out</button>
            </div>
        </header>

        <section class="welcome-panel" aria-labelledby="welcomeHeading">
            <p class="eyebrow">YOUR TRAVEL DESK</p>
            <h1 id="welcomeHeading">Welcome back, <span id="customerName">Customer</span>.</h1>
            <p class="welcome-copy">Keep track of your upcoming journeys, quotations, and payments in one place.</p>
        </section>

        <section class="summary-grid" aria-label="Booking overview">
            <button class="summary-item is-selected" type="button" data-filter="all" aria-pressed="true">
                <span class="summary-label">Your journeys</span>
                <strong id="totalBookings">0</strong>
            </button>
            <button class="summary-item summary-item-gold" type="button" data-filter="awaiting" aria-pressed="false">
                <span class="summary-label">Awaiting quotation</span>
                <strong id="awaitingQuote">0</strong>
            </button>
            <button class="summary-item" type="button" data-filter="payment" aria-pressed="false">
                <span class="summary-label">Ready for payment</span>
                <strong id="readyForPayment">0</strong>
            </button>
        </section>

        <section class="trips-section" aria-labelledby="tripsHeading">
            <div class="section-heading">
                <div>
                    <p class="eyebrow">JOURNEY PLANNER</p>
                    <h2 id="tripsHeading">Your trips</h2>
                </div>
                <a class="new-booking-link" href="booking.html">Plan a journey <span aria-hidden="true">&#8599;</span></a>
            </div>
            <div id="bookingsContainer" class="bookings-container" aria-live="polite">
                <p class="loading-state">Loading your journeys...</p>
            </div>
        </section>
    </main>

    <script type="module" src="js/dashboard.js"></script>
    
    <!-- SEO & Tracking Scripts -->
    <script src="js/seo-config.js"></script>
    <script src="js/image-seo.js"></script>
    <script src="js/meta-pixel-config.js"></script>
    
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-24X3J2K6HH"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
    gtag('config', 'G-24X3J2K6HH');
    </script>
</body>

</html>

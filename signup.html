<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="Create your Little Monks Safaris account to book safaris, transfers and travel services in Kenya.">

<link rel="canonical" href="https://littlemonkssafaris.com/signup.html">

<meta property="og:description" content="Join Little Monks Safaris and book your perfect safari experience.">
<meta property="og:url" content="https://littlemonkssafaris.com/signup.html">
<link rel="stylesheet" href="auth.css">
<!-- Meta Pixel Code -->
<script>

    n.callMethod.apply(n,arguments):n.queue.push(arguments)};

<body>
<form id="signupForm" class="auth-container">
<h1>
Create Your Safari Account
</h1>
<input 
id="name"
name="name"
type="text"
placeholder="Full Name"
required>
<input 
id="email"
name="email"
type="email"
placeholder="Email Address"
required>
<div class="password-field">
    <input
        type="password"
        id="password"
        name="password"
        placeholder="Create Password">
    <span
        class="toggle-password"
        data-target="password">
        👁️
    </span>
</div>
<div class="password-field">
    <input
        type="password"
        id="confirmPassword"
        name="confirmPassword"
        placeholder="Confirm Password">
    <span
        class="toggle-password"
        data-target="confirmPassword">
        👁️
    </span>
</div>
<div id="passwordMatch"></div>
<div id="signupPasswordStrength" class="password-strength">
    Password strength : -

</div>
<button id="signupBtn" type="submit">
Create Account
</button>
<p>
Already have an account?
<a href="login.html">
Login
</a>
</p>
</form>
<script type="module" src="js/auth.js"></script>

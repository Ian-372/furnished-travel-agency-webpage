<!DOCTYPE html>
<html>

<head>

<title>Create Account | Little Monks Safaris</title>

<link rel="stylesheet" href="auth.css">

</head>


<body>


<div class="auth-container">


<h1>
Create Your Safari Account
</h1>


<input 
id="name"
type="text"
placeholder="Full Name">


<input 
id="email"
type="email"
placeholder="Email Address">


<input 
id="password"
type="password"
placeholder="Password">


<button id="signupBtn">

Create Account

</button>


<p>
Already have an account?

<a href="login.html">
Login
</a>

</p>


</div>



<script type="module" src="js/auth.js"></script>


</body>

</html>

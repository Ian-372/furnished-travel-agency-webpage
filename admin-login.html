<body>

<div class="login-card">

    <h1>Little Monks Safaris</h1>

    <p>Administrator Login</p>

    <form id="loginForm">

        <input
            type="email"
            id="email"
            placeholder="Email"
            required>

        <input
            type="password"
            id="password"
            placeholder="Password"
            required>

        <button type="submit">
            Login
        </button>

    </form>

    <button id="resetPasswordBtn" class="reset-password-button" type="button">
        Reset administrator password
    </button>

    <p id="message"></p>

</div>

<!DOCTYPE html>
<html>

<head>

<title>Customer Login | Little Monks Safaris</title>

<link rel="stylesheet" href="auth.css">

</head>


<body>


<form id="loginForm" class="auth-container">


<h1>
Welcome Back
</h1>



<input 
id="loginEmail"
name="email"
type="email"
placeholder="Email"
required>


<input 
id="loginPassword"
name="password"
type="password"
placeholder="Password"
required>


<button id="loginBtn" type="submit">

Login

</button>



<p>

New traveller?

<a href="signup.html">
Create Account
</a>

</p>



</form>



<script type="module" src="js/auth.js"></script>


</body>

</html>
